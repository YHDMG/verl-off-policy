# Synchronous off-policy replay buffer configuration.
# This feature replays past online rollout samples in the main PPO trainer.

# Whether to enable off-policy replay.
enable: false

# Maximum number of sequence samples stored in the replay buffer.
capacity: 0

# Number of on-policy training steps to collect before replay starts.
warmup_steps: 0

# Number of extra actor mini-batches to replay per step.
replay_mini_batch_multiplier: 0

# Replay schedule type. Only cosine_decay is supported in v1.
replay_schedule_type: cosine_decay

# Replay ratio multiplier at the beginning of training.
replay_start_ratio: 1.0

# Replay ratio multiplier at the end of training.
replay_end_ratio: 0.25

# Number of steps used for replay ratio annealing. Uses total training steps if <= 0.
replay_anneal_steps: 0

# Quality metric used to prioritize samples.
# - seq_mean_entropy: lower sequence mean entropy gets higher replay priority
# - seq_reward: higher sequence reward gets higher replay priority
quality_metric: seq_mean_entropy

# Exponential weight applied to normalized quality scores.
quality_alpha: 1.0

# Multiplicative boost applied to quality_alpha near the end of training.
late_quality_alpha_multiplier: 2.0

# Exponential decay horizon for staleness weighting.
staleness_horizon: 200

# Uniform exploration mixture added to priority sampling.
uniform_mix: 0.2

# Uniform exploration mixture used near the end of training.
late_uniform_mix: 0.05

# Drop samples older than this many training steps.
max_age_steps: 500

# Skip storing prompt groups whose advantages are all numerically zero.
zero_adv_epsilon: 1e-6

# Store replay tensors on CPU instead of keeping their original device.
cpu_offload: true

# Starting beta for replay sampling bias correction.
replay_bias_beta_start: 0.4

# Final beta for replay sampling bias correction.
replay_bias_beta_end: 1.0

# Maximum replay bias correction weight before batch renormalization.
replay_bias_weight_clip: 5.0

# EMA coefficient for replay health statistics.
replay_health_ema_beta: 0.2

# Target normalized ESS for sampled replay batches.
replay_health_target_ess: 0.6

# Target mean sequence-level deviation of rollout IS weights from 1.
replay_health_target_seq_dev: 0.15

# Extra uniform mixture added when replay health degrades.
replay_health_uniform_mix_boost: 0.3

# Minimum multiplier applied to quality_alpha under poor replay health.
replay_health_alpha_min_scale: 0.25

# Whether to prioritize informative prompt groups in replay sampling.
enable_difficulty_sampling: false

# Prompt-level difficulty scoring mode.
# - pass_rate: use grouped pass rate based on difficulty_pass_threshold
# - group_relative_dispersion: use within-uid reward dispersion only, no global pass threshold
difficulty_metric: pass_rate

# Sequence reward threshold used only when difficulty_metric=pass_rate.
difficulty_pass_threshold: 0.9

# Exponent applied to prompt informativeness before converting it into a priority multiplier.
difficulty_alpha: 1.0

# Minimum priority multiplier reserved for very easy or very hard prompt groups.
difficulty_min_priority_scale: 0.5

# Prompt groups with informativeness <= this value are logged as low-info.
difficulty_medium_lower: 0.25

# Prompt groups with informativeness >= this value are logged as high-info.
difficulty_medium_upper: 0.75
